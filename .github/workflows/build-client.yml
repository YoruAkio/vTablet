name: Build Flutter Client (Android)

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  Build-Client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.27.1
      - run: flutter pub get

      # Build Android
      - name: Build Android APK
        run: flutter build apk --release
      - name: Build Android AppBundle
        run: flutter build appbundle --release

      # Optional Sign Android (only if signing secrets are provided)
      - name: Setup build tool version variable
        if: ${{ secrets.SIGNING_KEY != '' }}
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION
      - uses: r0adkll/sign-android-release@v1
        name: Sign app APK
        if: ${{ secrets.SIGNING_KEY != '' }}
        id: sign_apk
        with:
          releaseDirectory: client/build/app/outputs/flutter-apk
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: vTablet_client_apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vTablet_client_aab
          path: client/build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: ${{ secrets.SIGNING_KEY != '' && steps.sign_apk.outputs.signedReleaseFile != '' }}
        with:
          name: vTablet_client_apk_signed
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
