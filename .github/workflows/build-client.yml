name: Build Flutter Client (Android)

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  Build-Client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.27.1
      - run: flutter pub get

      # Build Android
      - name: Build Android APK
        run: flutter build apk --release
      - name: Build Android AppBundle
        run: flutter build appbundle --release

      # Optional Sign Android (only if signing secrets are provided)
      - name: Sign APK (if secrets provided)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Signing release APK..."
            echo "$SIGNING_KEY" | base64 -d > signingKey.jks
            BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
            /usr/local/lib/android/sdk/build-tools/$BUILD_TOOL_VERSION/apksigner sign \
              --ks signingKey.jks \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KEY_PASSWORD" \
              --out build/app/outputs/flutter-apk/app-release-signed.apk \
              build/app/outputs/flutter-apk/app-release.apk
            rm -f signingKey.jks
            echo "APK successfully signed."
          else
            echo "No SIGNING_KEY secret provided. Using default release APK."
          fi
      
      - uses: actions/upload-artifact@v4
        with:
          name: vTablet_client_apk
          path: client/build/app/outputs/flutter-apk/app-release*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vTablet_client_aab
          path: client/build/app/outputs/bundle/release/app-release.aab
