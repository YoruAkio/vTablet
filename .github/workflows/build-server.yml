name: Build Golang Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  Build-Linux-Server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
      - name: Build Linux amd64
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/vtablet-linux-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: vTablet_server_linux_amd64
          path: server/build/vtablet-linux-amd64

  Build-Windows-Server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows
        uses: crazy-max/ghaction-xgo@v3
        with:
          xgo_version: latest
          go_version: latest
          dest: build
          prefix: vtablet
          targets: windows/amd64,windows/386
          v: true
          x: true
          race: false
          ldflags: -H=windowsgui -s -w
          buildmode: default
          trimpath: true
          working_dir: ./server

      - name: Run UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            server/build/*.exe
          args: --best

      - uses: actions/upload-artifact@v4
        with:
          name: vTablet_server_windows_386
          path: server/build/vtablet-windows-386.exe

      - uses: actions/upload-artifact@v4
        with:
          name: vTablet_server_windows_amd64
          path: server/build/vtablet-windows-amd64.exe
