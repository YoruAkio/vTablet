name: Release All Targets

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave blank for date vYYYY.MM.DD)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.27.1
      - run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android AppBundle
        run: flutter build appbundle --release

      - name: Prepare & Sign Android Release Assets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p ../release-android
          if [ -n "$SIGNING_KEY" ]; then
            echo "Signing release APK..."
            echo "$SIGNING_KEY" | base64 -d > signingKey.jks
            BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
            /usr/local/lib/android/sdk/build-tools/$BUILD_TOOL_VERSION/apksigner sign \
              --ks signingKey.jks \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KEY_PASSWORD" \
              --out ../release-android/vTablet-client-android.apk \
              build/app/outputs/flutter-apk/app-release.apk
            rm -f signingKey.jks
            echo "APK successfully signed."
          else
            echo "No SIGNING_KEY secret provided. Using default release APK."
            cp build/app/outputs/flutter-apk/app-release.apk ../release-android/vTablet-client-android.apk
          fi
          cp build/app/outputs/bundle/release/app-release.aab ../release-android/vTablet-client-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-android/*

  build-linux:
    name: Build Linux Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev
      - name: Build Linux amd64 (GUI with Tray)
        run: |
          mkdir -p build
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/vtablet-linux-amd64 .
      - name: Build Linux amd64 (Headless)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/vtablet-linux-headless-amd64 .
      - name: Package Linux release archives
        shell: bash
        run: |
          mkdir -p ../release-linux
          # Copy standalone binaries
          cp build/vtablet-linux-amd64 ../release-linux/vtablet-linux-amd64
          cp build/vtablet-linux-headless-amd64 ../release-linux/vtablet-linux-headless-amd64

          # Package GUI tarball (binary + udev rules + systemd service + readme)
          mkdir -p /tmp/pkg-gui
          cp build/vtablet-linux-amd64 /tmp/pkg-gui/vtablet
          cp 99-vtablet.rules vtablet.service /tmp/pkg-gui/
          cp ../README.md /tmp/pkg-gui/
          tar -czvf ../release-linux/vtablet-linux-amd64.tar.gz -C /tmp/pkg-gui .
          rm -rf /tmp/pkg-gui

          # Package Headless tarball (binary + udev rules + systemd service + readme)
          mkdir -p /tmp/pkg-headless
          cp build/vtablet-linux-headless-amd64 /tmp/pkg-headless/vtablet
          cp 99-vtablet.rules vtablet.service /tmp/pkg-headless/
          cp ../README.md /tmp/pkg-headless/
          tar -czvf ../release-linux/vtablet-linux-headless-amd64.tar.gz -C /tmp/pkg-headless .
          rm -rf /tmp/pkg-headless

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-linux/*

  build-windows:
    name: Build Windows Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows
        uses: crazy-max/ghaction-xgo@v3
        with:
          xgo_version: latest
          go_version: latest
          dest: build
          prefix: vtablet
          targets: windows/amd64
          v: true
          x: true
          race: false
          ldflags: -H=windowsgui -s -w
          buildmode: default
          trimpath: true
          working_dir: ./server

      - name: Run UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            server/build/*.exe
          args: --best

      - name: Package Windows release archives
        shell: bash
        run: |
          mkdir -p release-windows
          cp server/build/vtablet-windows-amd64.exe release-windows/vtablet-windows-amd64.exe
          cd release-windows
          zip -9 vtablet-windows-amd64.zip vtablet-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-windows/*

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: release_tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG="$REF_NAME"
          else
            git fetch --tags || true
            DATE_TAG=$(date +'%Y.%m.%d')
            COUNT=1
            TAG="v${DATE_TAG}"
            while git rev-parse "$TAG" >/dev/null 2>&1; do
              TAG="v${DATE_TAG}.${COUNT}"
              COUNT=$((COUNT + 1))
            done
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare Release Directory & Checksums
        shell: bash
        run: |
          mkdir -p dist
          find downloaded-artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "Release assets prepared:"
          ls -lh
          cd ..

      - name: Generate Release Notes
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "v2026.11.19.3")

          echo "## What's Changed" > release_notes.md
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s by @YoruAkio in https://github.com/YoruAkio/vTablet/commit/%H" >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "## New Contributors" >> release_notes.md
            echo "* @YoruAkio made their first contribution in https://github.com/YoruAkio/vTablet/commit/62df2f291c5d787207a26b4109bcdfb771d6ff28" >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/YoruAkio/vTablet/compare/${PREV_TAG}...${TAG}" >> release_notes.md
          else
            git log --pretty=format:"* %s by @YoruAkio in https://github.com/YoruAkio/vTablet/commit/%H" -n 20 >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/YoruAkio/vTablet/commits/${TAG}" >> release_notes.md
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          gh release create "$TAG" \
            --title "vTablet $TAG" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            dist/*
